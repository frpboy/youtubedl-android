name: Stock modern API26 runtime qualification

# REVIEW DRAFT - bounded manual qualification only. No signing secrets, no
# Maven publication, no release. Builds the pinned immutable candidate source
# and runs the compat-smoke harness (11 probes incl. Jackson.updateReadTree,
# fixture-corrected per-run extraction dirs) on a stock API26 x86_64 emulator
# on the free GitHub-hosted runner. x86_64 emulator is not ARM device proof;
# that residual caveat is carried explicitly in the review packet.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-runtime-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use only independently reviewed immutable candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: a32f76771a619fbd961d666340ec88cf5f1a18a5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install compile SDK and check KVM fail-closed
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          if [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::Requires runner-provided readable/writable /dev/kvm; this workflow will not change host device permissions."
            exit 1
          fi
      - name: Build separate qualification APK (no signing secrets or Maven publish)
        run: |
          ./gradlew --no-daemon :compat-smoke:assembleDebug :compat-smoke:hashRuntimeClasspath
          mkdir -p build/runtime-evidence
          test "$(git rev-parse HEAD)" = a32f76771a619fbd961d666340ec88cf5f1a18a5
          test "$(git rev-parse HEAD^{tree})" = a5e28df233cee587a0cb070f83b7fe81b6e97b40
          git rev-parse HEAD > build/runtime-evidence/source-commit.txt
          printf '%s\n' "$GITHUB_SHA" > build/runtime-evidence/dispatch-commit.txt
          printf '%s\n' "$GITHUB_WORKFLOW_REF" > build/runtime-evidence/workflow-ref.txt
          sha256sum compat-smoke/build/outputs/apk/debug/compat-smoke-debug.apk > build/runtime-evidence/apk.sha256
          ./gradlew --no-daemon :compat-smoke:dependencies --configuration debugRuntimeClasspath > build/runtime-evidence/dependency-tree.txt
      - name: Actual API26 runtime test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/run-compat-smoke.py 26 build/runtime-evidence
      - name: Retain exact runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-api26-${{ github.sha }}
          path: |
            build/runtime-evidence/
            compat-smoke/build/outputs/apk/debug/compat-smoke-debug.apk
          if-no-files-found: error
          retention-days: 7
