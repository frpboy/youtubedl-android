name: Build owned Android Maven wrappers
on:
  push:
    branches: ['qualification/api24-stock-modern-20261112']
    paths: ['.qualification/api24-owner-trigger.json']
permissions:
  contents: read
jobs:
  dependency-runtime-qualification:
    if: github.event_name == 'push' && github.ref == 'refs/heads/qualification/api24-stock-modern-20261112' && github.actor == 'frpboy'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Admit exact owner trigger and unchanged preparation source
        env:
          EXPECTED_REF: refs/heads/qualification/api24-stock-modern-20261112
          EXPECTED_ACTOR: frpboy
          SOURCE_COMMIT: 2e67b1190fd1f2578ec942c28aebe2ed7b1524dc
          PREVIOUS_OWNER_COMMIT: ab8be1851f2df0c2f30c182ab21d182c0aaff299
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          e=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert e['ref']==os.environ['EXPECTED_REF']
          assert e['sender']['login']==os.environ['EXPECTED_ACTOR']
          assert not e.get('forced') and not e.get('created') and not e.get('deleted')
          assert len(e['commits'])==1 and e['after']==os.environ['GITHUB_SHA']
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert git('rev-parse','HEAD^')==e['before']
          assert git('rev-parse','HEAD~2')==os.environ['SOURCE_COMMIT']
          assert git('rev-parse','HEAD~3')==os.environ['PREVIOUS_OWNER_COMMIT']
          assert git('rev-parse',e['before']+':.qualification/api24-owner-trigger.json')=='8d568c5c9d376e21a79d37a7c9df2857a8465a47'
          source=git('diff','--name-status',os.environ['PREVIOUS_OWNER_COMMIT'],os.environ['SOURCE_COMMIT']).splitlines()
          assert source==['M\tcompat-smoke/src/main/java/com/frpboy/mavencompat/SmokeActivity.kt','M\tscripts/run-compat-smoke.py','A\tscripts/test-compat-collector.py'],source
          prep=git('diff','--name-status',os.environ['SOURCE_COMMIT'],e['before']).splitlines()
          assert prep==['M\t.github/workflows/build.yml','A\tdocs/API24-INDEPENDENT-PROBES-OWNER-ROUTE.md'],prep
          changes=git('diff','--name-status',e['before'],e['after']).splitlines()
          assert changes==['M\t.qualification/api24-owner-trigger.json'], changes
          marker=json.loads(pathlib.Path('.qualification/api24-owner-trigger.json').read_text())
          assert marker=={'sourceCommit':os.environ['SOURCE_COMMIT'],'purpose':'independent-probes-api24-api26-collector-v2','ownerStart':True}
          assert e['head_commit']['message'].splitlines()[0]=='Start reviewed independent API24 and API26 probes'
          PYTHON
      - name: Use only independently reviewed immutable experiment source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 2e67b1190fd1f2578ec942c28aebe2ed7b1524dc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install compile SDK and enable KVM
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build separate qualification APK (no signing secrets or Maven publish)
        run: |
          ./gradlew --no-daemon :compat-smoke:assembleDebug
          mkdir -p build/runtime-evidence
          test "$(git rev-parse HEAD)" = 2e67b1190fd1f2578ec942c28aebe2ed7b1524dc
          test "$(git rev-parse HEAD^{tree})" = f7b51c52aea8dad14b0730a2cfaa764e477c4705
          git rev-parse HEAD > build/runtime-evidence/source-commit.txt
          printf '%s\n' "$GITHUB_SHA" > build/runtime-evidence/owner-trigger-commit.txt
          printf '%s\n' "$GITHUB_WORKFLOW_REF" > build/runtime-evidence/workflow-ref.txt
          sha256sum compat-smoke/build/outputs/apk/debug/compat-smoke-debug.apk > build/runtime-evidence/apk.sha256
          ./gradlew --no-daemon :compat-smoke:dependencies --configuration debugRuntimeClasspath > build/runtime-evidence/dependency-tree.txt
      - name: Actual API runtime test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/run-compat-smoke.py ${{ matrix.api }} build/runtime-evidence
      - name: Retain exact runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-api${{ matrix.api }}-${{ github.sha }}
          path: |
            build/runtime-evidence/
            compat-smoke/build/outputs/apk/debug/compat-smoke-debug.apk
          if-no-files-found: error
          retention-days: 7
